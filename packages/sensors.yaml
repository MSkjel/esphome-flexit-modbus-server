# Temperatures, heating/cooling/rotor %, max timer, runtime counters and alarms.
# Needs core.yaml

# The live values come in the CX60's status, nothing until the first one. While it's old the numbers are unknown
# and the binary sensors keep their last state.

# ESPHome skips top-level keys that start with a dot
.air_temperature: &air_temperature
  platform: template
  update_interval: 60s
  device_class: temperature
  state_class: measurement
  unit_of_measurement: "°C"
  filters:
    - delta: 0.2
.percentage: &percentage
  platform: template
  state_class: measurement
  unit_of_measurement: "%"
.runtime: &runtime
  platform: template
  update_interval: 60s
  device_class: duration
  state_class: total_increasing
  unit_of_measurement: "h"

packages:
  alarm_supply_sensor_faulty: !include
    file: parts/alarm.yaml
    vars: {id: alarm_supply_sensor_faulty, name: Alarm Supply Sensor Faulty, register: REG_ALARM_SENSOR_SUPPLY_FAULTY}
  alarm_extract_sensor_faulty: !include
    file: parts/alarm.yaml
    vars: {id: alarm_extract_sensor_faulty, name: Alarm Extract Sensor Faulty,
           register: REG_ALARM_SENSOR_EXTRACT_FAULTY}
  alarm_outdoor_sensor_faulty: !include
    file: parts/alarm.yaml
    vars: {id: alarm_outdoor_sensor_faulty, name: Alarm Outdoor Sensor Faulty,
           register: REG_ALARM_SENSOR_OUTDOOR_FAULTY}
  alarm_return_water_sensor_faulty: !include
    file: parts/alarm.yaml
    vars: {id: alarm_return_water_sensor_faulty, name: Alarm Return Water Sensor Faulty,
           register: REG_ALARM_SENSOR_RETURN_WATER_FAULTY}
  alarm_overheat_triggered: !include
    file: parts/alarm.yaml
    vars: {id: alarm_overheat_triggered, name: Alarm Overheat Triggered, register: REG_ALARM_SENSOR_OVERHEAT_TRIGGERED}
  alarm_external_smoke_sensor_triggered: !include
    file: parts/alarm.yaml
    vars: {id: alarm_external_smoke_sensor_triggered, name: Alarm External Smoke Sensor Triggered,
           register: REG_ALARM_SENSOR_SMOKE_EXTERNAL_TRIGGERED}
  alarm_water_coil_faulty: !include
    file: parts/alarm.yaml
    vars: {id: alarm_water_coil_faulty, name: Alarm Water Coil Faulty, register: REG_ALARM_SENSOR_WATER_COIL_FAULTY}
  alarm_heat_exchanger_faulty: !include
    file: parts/alarm.yaml
    vars: {id: alarm_heat_exchanger_faulty, name: Alarm Heat Exchanger Faulty,
           register: REG_ALARM_SENSOR_HEAT_EXCHANGER_FAULTY}
  alarm_filter_change: !include
    file: parts/alarm.yaml
    vars: {id: alarm_filter_change, name: Alarm Filter Change, register: REG_ALARM_FILTER_CHANGE}

sensor:
  # Sent when it changes
  - platform: template
    id: setpoint_air_temperature
    name: "Setpoint Air Temperature"
    update_interval: 1s
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    lambda: |-
      if (!id(server)->fresh())
        return NAN;
      return id(server)->read_holding_register_temperature(flexit_modbus_server::REG_TEMPERATURE_SETPOINT);
    filters:
      - delta: 0.05

  - <<: *air_temperature
    id: supply_air_temperature
    name: "Supply Air Temperature"
    lambda: |-
      if (!id(server)->fresh())
        return NAN;
      return id(server)->read_holding_register_temperature(flexit_modbus_server::REG_TEMPERATURE_SUPPLY_AIR);

  - <<: *air_temperature
    id: extract_air_temperature
    name: "Extract Air Temperature"
    lambda: |-
      if (!id(server)->fresh())
        return NAN;
      return id(server)->read_holding_register_temperature(flexit_modbus_server::REG_TEMPERATURE_EXTRACT_AIR);

  - <<: *air_temperature
    id: outdoor_air_temperature
    name: "Outdoor Air Temperature"
    lambda: |-
      if (!id(server)->fresh())
        return NAN;
      return id(server)->read_holding_register_temperature(flexit_modbus_server::REG_TEMPERATURE_OUTDOOR_AIR);

  - platform: template
    id: return_water_temperature
    name: "Return Water Temperature"
    update_interval: 60s
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    lambda: |-
      if (!id(server)->fresh())
        return NAN;
      return id(server)->read_holding_register_temperature(flexit_modbus_server::REG_TEMPERATURE_RETURN_WATER);

  - <<: *percentage
    id: heating_percentage
    name: "Heating Percentage"
    update_interval: 20s
    lambda: |-
      if (!id(server)->fresh())
        return NAN;
      return id(server)->read_holding_register(flexit_modbus_server::REG_PERCENTAGE_HEATING);

  - <<: *percentage
    id: cooling_percentage
    name: "Cooling Percentage"
    update_interval: 20s
    lambda: |-
      if (!id(server)->fresh())
        return NAN;
      return id(server)->read_holding_register(flexit_modbus_server::REG_PERCENTAGE_COOLING);

  - <<: *percentage
    id: heat_exchanger_percentage
    name: "Heat Exchanger Percentage"
    update_interval: 5s
    lambda: |-
      if (!id(server)->fresh())
        return NAN;
      return id(server)->read_holding_register(flexit_modbus_server::REG_PERCENTAGE_HEAT_EXCHANGER);

  - <<: *percentage
    id: supply_fan_speed_percentage
    name: "Supply Fan Speed Percentage"
    update_interval: 5s
    lambda: |-
      if (!id(server)->fresh())
        return NAN;
      return id(server)->read_holding_register(flexit_modbus_server::REG_PERCENTAGE_SUPPLY_FAN);

  - platform: template
    id: max_timer_remaining
    name: "Max Timer Remaining"
    update_interval: 5s
    device_class: duration
    unit_of_measurement: "min"
    accuracy_decimals: 0
    lambda: |-
      if (!id(server)->fresh())
        return NAN;
      // register is in seconds, rounded up so it only shows 0 when the timer is off
      uint16_t seconds = id(server)->read_holding_register(
        flexit_modbus_server::REG_SECONDS_REMAINING_MAX_TIMER
      );
      return (seconds + 59) / 60;

  - <<: *runtime
    id: runtime
    name: "Runtime"
    lambda: return id(server)->read_holding_register_hours(flexit_modbus_server::REG_RUNTIME_HIGH);

  - <<: *runtime
    id: runtime_normal
    name: "Runtime Normal"
    lambda: return id(server)->read_holding_register_hours(flexit_modbus_server::REG_RUNTIME_NORMAL_HIGH);

  - <<: *runtime
    id: runtime_stop
    name: "Runtime Stop"
    lambda: return id(server)->read_holding_register_hours(flexit_modbus_server::REG_RUNTIME_STOP_HIGH);

  - <<: *runtime
    id: runtime_min
    name: "Runtime Min"
    lambda: return id(server)->read_holding_register_hours(flexit_modbus_server::REG_RUNTIME_MIN_HIGH);

  - <<: *runtime
    id: runtime_max
    name: "Runtime Max"
    lambda: return id(server)->read_holding_register_hours(flexit_modbus_server::REG_RUNTIME_MAX_HIGH);

  - <<: *runtime
    id: runtime_rotor
    name: "Runtime Rotor"
    lambda: return id(server)->read_holding_register_hours(flexit_modbus_server::REG_RUNTIME_ROTOR_HIGH);

  - <<: *runtime
    id: runtime_heater
    name: "Runtime Heater"
    lambda: return id(server)->read_holding_register_hours(flexit_modbus_server::REG_RUNTIME_HEATER_HIGH);

  - <<: *runtime
    id: runtime_filter
    name: "Runtime Filter"
    lambda: return id(server)->read_holding_register_hours(flexit_modbus_server::REG_RUNTIME_FILTER_HIGH);

binary_sensor:
  - platform: template
    id: heater_enabled
    name: "Heater Enabled"
    lambda: |-
      if (!id(server)->fresh())
        return {};
      return id(server)->read_holding_register(flexit_modbus_server::REG_STATUS_HEATER) != 0;
