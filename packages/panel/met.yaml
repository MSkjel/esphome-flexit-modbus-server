# The weather as a screensaver picture, drawn on the ESP from MET Norway's forecast. Needs panel.yaml.
# Show it with the "Panel Picture" select or the panel_show_picture action.
#   - path: packages/panel/met.yaml
#     vars: {latitude: "59.9139", longitude: "10.7522"}
# latitude and longitude go out with 4 decimals, as MET Norway asks. Every update_interval we check whether the
# forecast has expired and only then ask again, with If-Modified-Since. ESPHome logs a 304 answer to that as a
# failed request, but the forecast just hasn't changed. When refused or not answered we back off, from an hour
# up to 12. The picture is redrawn every redraw_interval. name, encoding and quality work as in picture.yaml.
# "Panel Weather Scene" picks the landscape and starts at scene. "Panel Weather Aurora" starts at aurora, where auto
# means some clear nights north of 55 degrees. "Panel Weather Forecast" draws the forecast over the picture.
# The current weather is also a dashboard tile on the panel, under Display > Home screen > Dashboard tiles. It's
# listed by the weather right now, like Fair or Cloudy. The cabin's chimney smokes when the heater is on.
# Weather data: MET Norway, CC BY 4.0.
defaults:
  name: weather
  encoding: auto
  quality: auto
  update_interval: 5min
  redraw_interval: 5min
  scene: hills
  aurora: auto

http_request:
  id: panel_http
  useragent: esphome-flexit-modbus-server (github.com/MSkjel/esphome-flexit-modbus-server)

# api.met.no's certificate is from HARICA, which ESPHome's usual root bundle doesn't have, so we take the full one.
# About 70 KB more flash.
esp32:
  framework:
    advanced:
      use_full_certificate_bundle: true
    sdkconfig_options:
      # TLS only holds its 20 KB of buffers while a request runs, so the pictures have the RAM in between
      CONFIG_MBEDTLS_DYNAMIC_BUFFER: "y"

select:
  - id: !extend panel_picture
    options: ["${name}"]
  - platform: template
    id: panel_weather_scene
    name: "Panel Weather Scene"
    entity_category: config
    icon: "mdi:image-filter-hdr"
    options: ["hills", "coast", "mountains", "city"]
    initial_option: "${scene}"
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          flexit::panel::met::options.ground = flexit::panel::met::ground_of(x.c_str());
          flexit::panel::met::redraw();
  - platform: template
    id: panel_weather_aurora
    name: "Panel Weather Aurora"
    entity_category: config
    icon: "mdi:aurora"
    options: ["auto", "off", "always"]
    initial_option: "${aurora}"
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          flexit::panel::met::options.aurora = flexit::panel::met::aurora_of(x.c_str());
          flexit::panel::met::redraw();

switch:
  - platform: template
    id: panel_weather_forecast
    name: "Panel Weather Forecast"
    entity_category: config
    icon: "mdi:weather-cloudy-clock"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: flexit::panel::met::with_forecast = true; flexit::panel::met::redraw();
    on_turn_off:
      - lambda: flexit::panel::met::with_forecast = false; flexit::panel::met::redraw();

text_sensor:
  - platform: template
    id: panel_weather
    name: "Panel Weather"
    entity_category: diagnostic
    icon: "mdi:weather-partly-cloudy"

script:
  - id: panel_weather_fetch
    mode: single
    then:
      - lambda: |-
          if (flexit::panel::met::due())
            flexit::panel::met::fetch();

esphome:
  on_boot:
    - then:
        - lambda: |-
            flexit::panel::met::setup(${latitude}, ${longitude}, "${name}", "${encoding}", "${quality}");
            flexit::panel::met::options.ground = flexit::panel::met::ground_of(id(panel_weather_scene).current_option().c_str());
            flexit::panel::met::options.aurora = flexit::panel::met::aurora_of(id(panel_weather_aurora).current_option().c_str());
            flexit::panel::met::on_status = [](const std::string &s) { id(panel_weather).publish_state(s); };
        - wait_until:
            condition:
              lambda: return network::is_connected() && id(flexit_panel_time).now().is_valid();
        - delay: 30s  # let the network and the panel's first transfers settle
        - script.execute: panel_weather_fetch

interval:
  - interval: ${update_interval}
    then:
      - script.execute: panel_weather_fetch
  - interval: ${redraw_interval}
    then:
      - lambda: |-
          flexit::panel::met::options.heater_pct = id(server).read_holding_register(flexit_modbus_server::REG_PERCENTAGE_HEATING);
          flexit::panel::met::redraw();
