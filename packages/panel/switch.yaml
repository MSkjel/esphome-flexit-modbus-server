# One of your switches on the panel, on the smart home or comfort page.
#   - path: packages/panel/switch.yaml
#     vars: {entity: garden_lights, label: Garden lights|Hagelys, icon: bulb}
# name, label, help, icon, page, view and menu work as in sensor.yaml, on_text and off_text as in
# binary_sensor.yaml
defaults:
  name: ""
  on_text: ""
  off_text: ""
  icon: circle
  help: ""
  page: smart_home
  view: "true"
  menu: "true"

esphome:
  on_boot:
    - then:
        - lambda: |-
            static int i = flexit::panel::Item(std::string("${name}").empty() ? "${entity}" : "${name}", ITEM_TOGGLE)
                               .label(R"~(${label})~")
                               .help(R"~(${help})~")
                               .states(R"~(${on_text})~", R"~(${off_text})~")
                               .icon("${icon}")
                               .page("${page}")
                               .view(${view})
                               .menu(${menu})
                               .on_set([](float v) {
                                 if (v)
                                   id(${entity}).turn_on();
                                 else
                                   id(${entity}).turn_off();
                               })
                               .add();
            id(${entity}).add_on_state_callback([](bool on) { flexit::panel::item_value(i, on); });
            flexit::panel::item_value(i, id(${entity}).state);
