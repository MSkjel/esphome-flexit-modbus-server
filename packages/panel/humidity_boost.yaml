# Humidity boost and the humidity with its last 24 hours, on the panel's comfort page. Needs panel.yaml and
# humidity_boost.yaml. Set help to say where the sensor is, as "English|Norsk".
defaults:
  help: "Relative humidity in the house.|Relativ fuktighet i huset."

packages:
  humidity_level: !include
    file: sensor.yaml
    vars:
      name: humidity
      entity: ${flexit_humidity_sensor}
      label: Humidity|Fuktighet
      unit: "%"
      icon: humidity
      page: comfort
      trend: "true"
      levels: "20, 30, 60, 70"
      help: ${help}
  humidity_boost: !include
    file: switch.yaml
    vars:
      name: humidity_boost
      entity: humidity_boost_enable
      label: Humidity boost|Fuktforsering
      icon: shower
      page: comfort
      help: >-
        Boost when humidity jumps, for example after a shower.|Forsering når fuktigheten hopper, for eksempel etter
        en dusj.
  humidity_trigger: !include
    file: number.yaml
    vars:
      name: humidity_trigger
      entity: humidity_trigger_delta
      label: Humidity trigger|Fuktterskel
      unit: "%"
      decimals: "1"
      icon: humidity
      page: comfort
      view: "false"
      help: >-
        Boost when humidity is this much above its normal level.|Forsering når fuktigheten er så mye over sitt
        vanlige nivå.
