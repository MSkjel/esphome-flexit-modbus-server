# Flash the CI600 panel's firmware from Home Assistant, over the bus. Works on a stock panel too, no SWD, jumper
# or opening the panel. Needs panel.yaml.
#   - path: packages/panel/update.yaml
#     vars: {url: "https://github.com/MSkjel/flexit-ci600-firmware/releases/latest/download/ci600.fxup"}
#
# url: where to get the .fxup, built by tools/mkupdate.py in the firmware repo. The default is the newest GitHub
# release. For a file in Home Assistant's /config/www use "http://homeassistant.local:8123/local/ci600.fxup".
# Any other HTTP(S) URL works too. The "Panel Firmware URL" text box starts at it after each restart of the ESP,
# change it there for a one-off. "Flash Panel Firmware" starts the update, "Panel Firmware Update" and
# "Panel Firmware Progress" show how it goes.
#
# The ESP downloads the file a few KB at a time into its spare app slot, where its own next OTA update goes, and
# streams it to the panel's ROM bootloader. The bootloader decrypts it and checks the whole image before marking
# it valid, as the last thing it writes. A bad download, a wrong image or a frame the unit talked over fails that
# check, and then the panel has nothing bootable and waits in the bootloader for another try.
# Before anything is flashed the ESP probes for the panel the way the unit does at start-up: the address it
# reported over the link if any, then 3, 1 and 2, never the ESP's own. The reply says what runs there. A stock
# panel is flashed if it's a 7.x, our firmware if the file is another version, and nothing else. "Panel Firmware
# Force" also flashes the same version again, or a stock panel that isn't 7.x. The bootloader always answers at 1.
# A flash takes a few minutes, with the panel's screen dark and its three LEDs on.
# Right after an OTA update of the ESP itself, wait about a minute until it has booted fine. Until then it keeps
# its previous firmware in the spare slot in case it has to go back.
defaults:
  url: "https://github.com/MSkjel/flexit-ci600-firmware/releases/latest/download/ci600.fxup"

http_request:
  # GitHub's release download redirects to a URL about 1.7 KB long, longer than the default 512-byte buffers
  buffer_size_tx: 4096
  buffer_size_rx: 2048

esp32:
  framework:
    sdkconfig_options:
      # the IDF cert bundle for https, the full set so GitHub's CA is in it. met.yaml sets DEFAULT_FULL too.
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE: "y"
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL: "y"

text:
  - platform: template
    id: panel_firmware_url
    name: "Panel Firmware URL"
    entity_category: config
    icon: "mdi:link-variant"
    mode: text
    optimistic: true
    initial_value: "${url}"

button:
  - platform: template
    id: panel_firmware_flash
    name: "Flash Panel Firmware"
    entity_category: config
    icon: "mdi:cellphone-arrow-down"
    on_press:
      - if:
          condition:
            lambda: return flexit::panel::update::can_start();
          then:
            # the download follows GitHub's redirects
            - http_request.get:
                url: !lambda return id(panel_firmware_url).state;
                on_response:
                  then:
                    - lambda: flexit::panel::update::download(response);
                on_error:
                  then:
                    - lambda: flexit::panel::update::status("Couldn't connect to download it");

switch:
  - platform: template
    id: panel_firmware_force
    name: "Panel Firmware Force"
    entity_category: config
    icon: "mdi:cellphone-arrow-down-variant"
    optimistic: true
    restore_mode: DISABLED  # off after every restart
    turn_on_action:
      - lambda: flexit::panel::update::force = true;
    turn_off_action:
      - lambda: flexit::panel::update::force = false;

text_sensor:
  - platform: template
    id: panel_firmware_update
    name: "Panel Firmware Update"
    entity_category: diagnostic
    icon: "mdi:progress-download"

sensor:
  - platform: template
    id: panel_firmware_progress
    name: "Panel Firmware Progress"
    entity_category: diagnostic
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:percent"

esphome:
  on_boot:
    - priority: 500
      then:
        - lambda: |-
            flexit::panel::handlers[K_BUS_ADDR] = [](uint32_t v) {  // the address the panel reports
              if (v >= 1 && v <= 247)
                flexit::panel::update::panel_addr = (uint8_t) v;
            };
            flexit::panel::update::on_status = [](const std::string &s) { id(panel_firmware_update).publish_state(s); };
            flexit::panel::update::on_progress = [](int pct) { id(panel_firmware_progress).publish_state(pct); };
            flexit::panel::update::setup();
