# A Home Assistant sensor on the panel with one include. Makes the homeassistant sensor (id ha_${name}) and puts
# it on the panel like sensor.yaml, with the same vars.
#   - path: packages/panel/ha_sensor.yaml
#     vars: {name: hot_water, entity_id: sensor.water_heater_temperature, label: Hot water|Varmtvann, icon: shower,
#            unit: °C}
# name is the item's name on the panel link and makes the ESPHome id. attribute takes that attribute of the
# entity instead of its state. decimals is 1 if empty, as a homeassistant sensor has. Give it a unit, the ESP
# doesn't get Home Assistant's.
defaults:
  attribute: ""
  unit: ""
  decimals: ""
  icon: circle
  help: ""
  page: smart_home
  view: "true"
  menu: "true"
  trend: "false"
  levels: ""
  min: "0"
  max: "100"

sensor:
  - platform: homeassistant
    id: ha_${name}
    entity_id: ${entity_id}
    attribute: ${attribute}

packages:
  item: !include
    file: sensor.yaml
    vars:
      entity: ha_${name}
      name: ${name}
      label: ${label}
      help: ${help}
      icon: ${icon}
      page: ${page}
      view: ${view}
      menu: ${menu}
      unit: ${unit}
      decimals: ${decimals}
      trend: ${trend}
      levels: ${levels}
      min: ${min}
      max: ${max}
