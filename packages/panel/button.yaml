# One of your buttons on the panel, on the smart home or comfort page.
#   - path: packages/panel/button.yaml
#     vars: {entity: open_garage, label: Garage door|Garasjeport, icon: door}
# name, label, help, icon, page, view and menu work as in sensor.yaml
defaults:
  name: ${entity}
  icon: circle
  help: ""
  page: smart_home
  view: "true"
  menu: "true"

esphome:
  on_boot:
    - then:
        - lambda: |-
            flexit::panel::Item("${name}", ITEM_BUTTON)
                .vars(R"~(${label})~", R"~(${help})~", "${icon}", "${page}", ${view}, ${menu})
                .on_set([](float) { id(${entity}).press(); })
                .add();
