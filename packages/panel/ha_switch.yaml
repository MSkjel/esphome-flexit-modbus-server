# A Home Assistant entity switched from the panel with one include. A template switch (id ha_${name}) follows the
# entity's state and runs on_action and off_action in Home Assistant, which needs "Allow the device to perform
# Home Assistant actions" ticked for this ESP in the ESPHome integration. It goes on the panel like switch.yaml,
# with the same vars.
#   - path: packages/panel/ha_switch.yaml
#     vars: {name: garden_lights, entity_id: light.garden, label: Garden lights|Hagelys, icon: bulb}
#   - path: packages/panel/ha_switch.yaml
#     vars: {name: front_door, entity_id: lock.front_door, label: Front door|Inngangsdør, icon: lock,
#            on_action: lock.lock, off_action: lock.unlock, on_state: locked, on_text: Locked|Låst,
#            off_text: Unlocked|Ulåst}
# The switch is on while the entity's state is on_state. name works as in ha_sensor.yaml.
defaults:
  on_action: homeassistant.turn_on
  off_action: homeassistant.turn_off
  on_state: "on"
  on_text: ""
  off_text: ""
  icon: circle
  help: ""
  page: smart_home
  view: "true"
  menu: "true"

text_sensor:
  - platform: homeassistant
    id: ha_${name}_state
    entity_id: ${entity_id}

switch:
  - platform: template
    id: ha_${name}
    restore_mode: DISABLED
    lambda: return id(ha_${name}_state).state == "${on_state}";
    turn_on_action:
      - homeassistant.action:
          action: ${on_action}
          data:
            entity_id: ${entity_id}
    turn_off_action:
      - homeassistant.action:
          action: ${off_action}
          data:
            entity_id: ${entity_id}

packages:
  item: !include
    file: switch.yaml
    vars:
      entity: ha_${name}
      name: ${name}
      label: ${label}
      help: ${help}
      icon: ${icon}
      page: ${page}
      view: ${view}
      menu: ${menu}
      on_text: ${on_text}
      off_text: ${off_text}
