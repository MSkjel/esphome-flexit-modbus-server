# The panel's screensaver picture as a "Panel Picture" camera in Home Assistant, nothing to set up there. It's the
# picture as the panel has it, without the clock and the animations the panel draws over it. Made when Home Assistant
# asks: a JPEG picture goes as it is, a 16-colour one like the weather is encoded first, no picture is black.
#   - packages/panel/camera.yaml
# RAM: nothing while nobody looks. While someone does, a copy of a JPEG picture (up to 14 KB) or 24 KB for a 16-colour
# one, freed 30 s after the last look. Not while a picture or animation is being made or sent. ESPHome has one camera
# per ESP.
# component_source: where the camera component comes from, a path for a local checkout
defaults:
  component_source: github://MSkjel/esphome-flexit-modbus-server@${flexit_ref}

external_components:
  - source: ${component_source}
    refresh: ${flexit_refresh}
    components: [flexit_panel_camera]

flexit_panel_camera:
  id: panel_camera
  name: "Panel Picture"

esphome:
  on_boot:
    - priority: 600
      then:
        - lambda: flexit::panel::snapshot::attach(id(panel_camera));
