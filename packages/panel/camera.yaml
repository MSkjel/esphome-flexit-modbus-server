# The panel's screensaver as a "Panel Picture" camera in Home Assistant, nothing to set up there. Made when Home
# Assistant asks, as a GIF of the screen in the panel's own colours: the 16-colour picture like the weather, with the
# animations playing over it where they were put. Their drifts, wanders, turns, sizes and waves aren't shown, nor is
# the clock. A photo the panel has as a JPEG is black in it, the ESP doesn't decode JPEGs.
#   - packages/panel/camera.yaml
# Home Assistant passes the GIF on labelled as a JPEG. Dashboards show it and play it, things that need a real JPEG
# like HomeKit or camera.snapshot get the GIF.
# RAM: nothing while nobody looks. While someone does, up to 48 KB for the GIF, a GIF that's longer ends early, and
# 22 KB more while it's made. Freed 30 s after the last look. Not while a picture or animation is being made or
# sent. ESPHome has one camera per ESP.
# component_source: where the camera component comes from, a path for a local checkout
defaults:
  component_source: github://MSkjel/esphome-flexit-modbus-server@${flexit_ref}

external_components:
  - source: ${component_source}
    refresh: ${flexit_refresh}
    components: [flexit_panel_camera]

flexit_panel_camera:
  id: panel_camera
  name: "Panel Picture"

esphome:
  on_boot:
    - priority: 600
      then:
        - lambda: flexit::panel::snapshot::attach(id(panel_camera));
