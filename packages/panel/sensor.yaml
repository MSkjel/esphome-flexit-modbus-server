# One of your sensors on the panel, on the smart home or comfort page and as a dashboard tile if you pick it.
#   - path: packages/panel/sensor.yaml
#     vars: {entity: living_room_temperature, label: Living room|Stue, icon: thermo}
# label and help are "English|Norsk", the panel shows the part for its language. How much of each text fits:
# docs/panel.md#how-long-texts-can-be.
defaults:
  name: ${entity}   # the item's name on the panel link. The panel keeps tiles by it
  unit: ""          # the sensor's own if empty
  decimals: ""      # the sensor's accuracy_decimals if empty
  icon: circle      # an id from code/panel/plink_icons.h, in lower case
  help: ""          # shown when ? is pressed on its row
  page: smart_home  # or comfort
  view: "true"      # false leaves it out of the page's view
  menu: "true"      # false leaves it out of the page's menu
  trend: "false"    # true keeps its last 24 hours on the sensors view. The panel has room for four.
  levels: ""        # "bad below, good from, good to, bad above", colours the value
  min: "0"          # ends of its gauge and bar
  max: "100"

esphome:
  on_boot:
    - then:
        - lambda: |-
            static int i = flexit::panel::Item("${name}", ITEM_SENSOR)
                               .label(R"~(${label})~")
                               .unit(std::string(R"~(${unit})~").empty()
                                         ? id(${entity}).get_unit_of_measurement_ref().str()
                                         : R"~(${unit})~")
                               .help(R"~(${help})~")
                               .icon("${icon}")
                               .decimals(std::string("${decimals}").empty()
                                             ? std::max(0, (int) id(${entity}).get_accuracy_decimals())
                                             : atoi("${decimals}"))
                               .page("${page}")
                               .view(${view})
                               .menu(${menu})
                               .trend(${trend})
                               .levels("${levels}")
                               .range(${min}, ${max})
                               .add();
            flexit::panel::follow(i, id(${entity}));
