# One of the CX60's on/off settings as a switch in HA, disabled until you enable it. Used by advanced.yaml.
#   - file: parts/setting_switch.yaml
#     vars: {id: cooling_enabled, name: Cooling Enabled, register: REG_CMD_COOLING_ENABLE}
# The register must be one the server saves, the switch follows it from the setting callback.
esphome:
  on_boot:
    - then:
        - lambda: |-
            // the saved one, the CX60 only sends its settings when it starts
            id(${id}).publish_state(id(server)->read_holding_register(flexit_modbus_server::${register}) != 0);
            id(server).add_on_setting_callback([](uint16_t reg, uint16_t value) {
              if (reg == flexit_modbus_server::${register})
                id(${id}).publish_state(value != 0);
            });

switch:
  - platform: template
    id: ${id}
    name: ${name}
    entity_category: config
    disabled_by_default: true
    restore_mode: DISABLED
    turn_on_action:
      - lambda: id(server)->send_cmd(flexit_modbus_server::${register}, 1);
    turn_off_action:
      - lambda: id(server)->send_cmd(flexit_modbus_server::${register}, 0);
