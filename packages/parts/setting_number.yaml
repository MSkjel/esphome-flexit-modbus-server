# One of the CS60's settings as a number in HA, disabled until you enable it. Used by advanced.yaml and
# fan_speeds.yaml.
#   - file: parts/setting_number.yaml
#     vars: {id: start_delay_1, name: Start Delay 1, register: REG_CMD_START_DELAY_1, min: 0, max: 255, unit: s}
# The register holds the value x scale, as a signed 16-bit number.
defaults:
  step: "1"
  unit: ""
  scale: "1"
  zero_unknown: "false"  # true when 0 means the CS60 hasn't sent it yet
  category: config       # "" for none

number:
  - platform: template
    id: ${id}
    name: ${name}
    entity_category: ${category}
    disabled_by_default: true
    min_value: ${min}
    max_value: ${max}
    step: ${step}
    unit_of_measurement: ${unit}
    mode: BOX
    update_interval: 1s
    lambda: |-
      int16_t v = static_cast<int16_t>(id(server)->read_holding_register(flexit_modbus_server::${register}));
      if (${zero_unknown} && v == 0)
        return {};
      return v / ${scale}.0f;
    set_action:
      lambda: id(server)->send_cmd(flexit_modbus_server::${register}, static_cast<int16_t>(lroundf(x * ${scale})));
