# One of the CX60's settings as a number in HA, disabled until you enable it. Used by advanced.yaml,
# fan_speeds.yaml and controls.yaml.
#   - file: parts/setting_number.yaml
#     vars: {id: start_delay_1, name: Start Delay 1, register: REG_CMD_START_DELAY_1, min: 0, max: 255, unit: s}
# The register holds value x scale, signed 16-bit, and must be one the server saves. The number shows its real
# value, never a boost's, and is sent when that changes.
defaults:
  step: "1"
  unit: ""
  scale: "1"
  zero_unknown: "false"  # true when 0 means the CX60 hasn't sent it yet
  category: config       # "" for none
  disabled: "true"       # disabled_by_default
  mode: BOX

esphome:
  on_boot:
    - then:
        - lambda: |-
            id(${id}).update();  // the saved one, the CX60 only sends its settings when it starts
            id(server).add_on_setting_callback([](uint16_t reg, uint16_t) {
              if (reg == flexit_modbus_server::${register})
                id(${id}).update();
            });

number:
  - platform: template
    id: ${id}
    name: ${name}
    entity_category: ${category}
    disabled_by_default: ${disabled}
    min_value: ${min}
    max_value: ${max}
    step: ${step}
    unit_of_measurement: ${unit}
    mode: ${mode}
    update_interval: never  # see on_boot, a template number sends every update
    lambda: |-
      int16_t v = static_cast<int16_t>(id(server)->real_value(flexit_modbus_server::${register}));
      if (${zero_unknown} && v == 0)
        return {};
      return v / ${scale}.0f;
    set_action:
      lambda: id(server)->send_cmd(flexit_modbus_server::${register}, static_cast<int16_t>(lroundf(x * ${scale})));
