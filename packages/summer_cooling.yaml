# Summer cooling. Runs max when it's too warm inside and cooler outside.
# Too warm is also measured against the setpoint, and it never runs while the heater is on.
# The CX60 still holds the supply air at its setpoint, so a lower setpoint cools more.
# This is done on the ESP, the CX60 doesn't have it.
# Needs core.yaml and controls.yaml

esphome:
  includes:
    - code/summer_cooling.h
  on_boot:
    - then:
        - lambda: id(summer_cooling_running).publish_state(false);  // off until the first tick

packages:
  # Cool when the extract air is warmer than this
  summer_cooling_above: !include
    file: parts/config_number.yaml
    vars: {id: summer_cooling_above, name: Summer Cooling Above, unit: "°C", device_class: temperature, min: 18,
           max: 30, step: 0.5, initial: 24}
  # and also this much warmer than the setpoint, so it doesn't cool a house the unit is trying to heat
  summer_cooling_above_setpoint: !include
    file: parts/config_number.yaml
    vars: {id: summer_cooling_above_setpoint, name: Summer Cooling Above Setpoint, unit: "°C", min: 0, max: 10,
           step: 0.5, initial: 1}
  # and the outdoor air is at least this much colder than the extract air
  summer_cooling_min_difference: !include
    file: parts/config_number.yaml
    vars: {id: summer_cooling_min_difference, name: Summer Cooling Min Difference, unit: "°C", min: 1, max: 10,
           step: 0.5, initial: 2}
  # Never below this outdoor temperature. Keeps it from running in winter
  # when a wood stove has made the house warm.
  summer_cooling_min_outdoor: !include
    file: parts/config_number.yaml
    vars: {id: summer_cooling_min_outdoor, name: Summer Cooling Min Outdoor, unit: "°C", device_class: temperature,
           min: 0, max: 25, initial: 12, disabled: "true"}

switch:
  - platform: template
    name: "Summer Cooling Enable"
    id: summer_cooling_enable
    icon: "mdi:snowflake"
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON

binary_sensor:
  # Only tick() changes it, the interval publishes it after each one
  - platform: template
    name: "Summer Cooling Active"
    id: summer_cooling_running
    device_class: running
    icon: "mdi:snowflake"

interval:
  - interval: 30s
    then:
      - lambda: |-
          flexit::summer_cooling::tick();
          id(summer_cooling_running).publish_state(flexit::summer_cooling::state.boost.active);
