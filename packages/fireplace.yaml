# Fireplace mode. Runs max with custom fan speeds for a while, then goes back to what it was.
# This is done on the ESP, the CX60 doesn't have it.
# Needs core.yaml and controls.yaml. EC fans only, it sets the max fan %

esphome:
  includes:
    - code/fireplace.h
  on_boot:
    - then:
        - lambda: id(server).add_on_setting_callback(flexit::fireplace::setting);

packages:
  fireplace_duration: !include
    file: parts/config_number.yaml
    vars: {id: fireplace_duration, name: Fireplace Mode Duration, min: 1, max: 240, initial: 60, unit: min}
  # The max fan speeds while it's on
  fireplace_supply_speed_control: !include
    file: parts/config_number.yaml
    vars: {id: fireplace_supply_speed_control, name: Fireplace Supply Fan Speed, min: 1, max: 100, initial: 90,
           unit: "%"}
  fireplace_extract_speed_control: !include
    file: parts/config_number.yaml
    vars: {id: fireplace_extract_speed_control, name: Fireplace Extract Fan Speed, min: 1, max: 100, initial: 20,
           unit: "%"}

switch:
  - platform: template
    name: "Fireplace Mode"
    id: fireplace_mode_switch
    restore_mode: DISABLED
    lambda: return flexit::fireplace::state.active;
    turn_on_action:
      - lambda: flexit::fireplace::turn_on();
    turn_off_action:
      - lambda: flexit::fireplace::turn_off();

binary_sensor:
  - platform: template
    name: "Fireplace Mode Conflict Detected"
    id: fireplace_conflict
    internal: true
    lambda: return flexit::fireplace::conflict();
    on_press:
      - lambda: ESP_LOGI(flexit::fireplace::TAG, "Changed by hand, turning fireplace mode off");
      - switch.turn_off: fireplace_mode_switch
