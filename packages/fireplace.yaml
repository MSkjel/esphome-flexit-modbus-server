# Fireplace mode. Runs max with custom fan speeds for a while, then goes back to what it was.
# This is done on the ESP, the CX60 doesn't have it.
# Needs core.yaml and controls.yaml. EC fans only, it sets the max fan %

esphome:
  includes:
    - code/fireplace.h
  on_boot:
    - then:
        - lambda: id(server).add_on_setting_callback(flexit::fireplace::setting);

# ESPHome skips top-level keys that start with a dot
.config_number: &config_number
  platform: template
  entity_category: config
  optimistic: true
  restore_value: true
  mode: BOX

switch:
  - platform: template
    name: "Fireplace Mode"
    id: fireplace_mode_switch
    restore_mode: DISABLED
    lambda: return flexit::fireplace::active;
    turn_on_action:
      - lambda: flexit::fireplace::turn_on();
    turn_off_action:
      - lambda: flexit::fireplace::turn_off();

number:
  - <<: *config_number
    name: "Fireplace Mode Duration"
    id: fireplace_duration
    min_value: 1
    max_value: 240
    step: 1
    initial_value: 60
    unit_of_measurement: "min"

  # The max fan speeds while it's on
  - <<: *config_number
    name: "Fireplace Supply Fan Speed"
    id: fireplace_supply_speed_control
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 90
    unit_of_measurement: "%"

  - <<: *config_number
    name: "Fireplace Extract Fan Speed"
    id: fireplace_extract_speed_control
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 20
    unit_of_measurement: "%"

binary_sensor:
  - platform: template
    name: "Fireplace Mode Conflict Detected"
    id: fireplace_conflict
    internal: true
    lambda: return flexit::fireplace::conflict();
    on_press:
      - lambda: ESP_LOGW("fireplace", "Changed by hand, turning fireplace mode off");
      - switch.turn_off: fireplace_mode_switch
