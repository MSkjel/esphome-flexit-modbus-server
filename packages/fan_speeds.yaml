# Fan % for min/normal/max. Only for EC fans (DS4 = EC).
# Needs core.yaml

number:
  - platform: template
    id: supply_air_percentage_min
    name: "Supply Air Percentage Min"
    max_value: 100
    min_value: 1
    step: 1
    disabled_by_default: True
    mode: BOX
    update_interval: 1s
    lambda: |-
      uint16_t v = id(server)->read_holding_register(flexit_modbus_server::REG_CMD_PERCENTAGE_SUPPLY_FAN_MIN);
      if (v == 0) return {};  // 0 = not synced from the CS60 yet
      return v;
    set_action:
      lambda: |-
        id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_PERCENTAGE_SUPPLY_FAN_MIN,
            x
        );

