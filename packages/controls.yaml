# Mode, setpoint, heater, max timer, filter/alarm reset etc.
# Needs core.yaml

globals:
  # Mode requests, name -> mode. Fireplace, humidity boost etc. add one while they want
  # a higher mode. mode_arbiter below runs the highest and goes back when they're all gone.
  # A manual mode change clears them all.
  - id: mode_requests
    type: std::map<std::string, int>
    restore_value: no

  # True while a request is holding the mode up. Saved to flash together with the
  # mode to go back to, so a reboot in the middle doesn't leave the unit in max.
  - id: mode_override_active
    type: bool
    restore_value: yes
    initial_value: 'false'

  - id: mode_override_base
    type: int
    restore_value: yes
    initial_value: '2'

  # The last mode we sent, when, and if the CS60 has switched to it yet
  - id: mode_override_target
    type: int
    restore_value: no
    initial_value: '-1'

  - id: mode_override_sent_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: mode_override_confirmed
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: mode_override_started
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  - id: mode_arbiter
    then:
      - lambda: |-
          const uint32_t now = millis();
          const int mode = id(server)->read_holding_register(flexit_modbus_server::REG_MODE);

          auto send = [&](int m) {
            id(mode_override_target) = m;
            id(mode_override_sent_ms) = now;
            id(mode_override_confirmed) = false;
            id(server)->send_cmd(flexit_modbus_server::REG_CMD_MODE, m);
            global_preferences->sync();
          };

          // First run after boot. If we rebooted while holding the mode up, go back now.
          if (!id(mode_override_started)) {
            id(mode_override_started) = true;
            if (id(mode_override_active)) {
              id(mode_override_active) = false;
              ESP_LOGW("mode", "Rebooted during a boost, going back to %s",
                       flexit_modbus_server::mode_to_string(id(mode_override_base)).c_str());
              send(id(mode_override_base));
            }
            return;
          }

          // The CS60 takes a few seconds to apply a mode we sent. Until it has (or 30s
          // have passed) the mode it reports says nothing about what the user wants.
          if (!id(mode_override_confirmed) &&
              (mode == id(mode_override_target) || now - id(mode_override_sent_ms) >= 30000)) {
            id(mode_override_confirmed) = true;
          }

          int want = 0;
          for (auto &r : id(mode_requests)) {
            if (r.second > want) want = r.second;
          }

          if (id(mode_override_active)) {
            if (id(mode_override_confirmed) && mode != id(mode_override_target)) {
              ESP_LOGW("mode", "Mode was changed by hand, dropping all boosts");
              id(mode_requests).clear();
              id(mode_override_active) = false;
              id(mode_override_base) = mode;
              global_preferences->sync();
              return;
            }

            const int desired = std::max(want, id(mode_override_base));
            if (desired == id(mode_override_target)) {
              return;
            }
            if (desired == id(mode_override_base)) {
              id(mode_override_active) = false;
              ESP_LOGI("mode", "Boosts done, going back to %s",
                       flexit_modbus_server::mode_to_string(desired).c_str());
            }
            send(desired);
            return;
          }

          // Nothing held up. Follow the mode the user has picked.
          if (id(mode_override_confirmed) && mode != id(mode_override_base)) {
            id(mode_override_base) = mode;
            if (!id(mode_requests).empty()) {
              ESP_LOGW("mode", "Mode was changed by hand, dropping all boosts");
              id(mode_requests).clear();
            }
            return;
          }

          // Requests only raise the mode, and never start a stopped unit
          if (id(mode_override_base) == 0 || want <= id(mode_override_base)) {
            return;
          }

          ESP_LOGI("mode", "Going from %s to %s",
                   flexit_modbus_server::mode_to_string(id(mode_override_base)).c_str(),
                   flexit_modbus_server::mode_to_string(want).c_str());
          id(mode_override_active) = true;
          send(want);

interval:
  - interval: 2s
    then:
      - script.execute: mode_arbiter

switch:
  - platform: template
    id: heater
    name: "Heater"
    lambda: "return id(server)->read_holding_register(flexit_modbus_server::REG_STATUS_HEATER);"
    turn_on_action:
      - lambda: |-
          id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_HEATER,
            1
          );
    turn_off_action:
      - lambda: |-
          id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_HEATER,
            0
          );

  - platform: template
    id: supply_air_control
    name: "Supply Air Control"
    restore_mode: DISABLED
    lambda: "return id(server)->read_holding_register(flexit_modbus_server::REG_CMD_TEMPERATURE_SUPPLY_AIR_CONTROL) == 1;"
    turn_on_action:
      - lambda: |-
          id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_TEMPERATURE_SUPPLY_AIR_CONTROL,
            1
          );
    turn_off_action:
      - lambda: |-
          id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_TEMPERATURE_SUPPLY_AIR_CONTROL,
            0
          );

button:
  - platform: template
    id: clear_alarms
    name: "Clear Alarms"
    on_press: 
      - lambda: |-
          id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_CLEAR_ALARMS,
            1
          );

  - platform: template
    id: reset_filter_interval
    name: "Reset Filter Interval"
    on_press: 
      - lambda: |-
          id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_CLEAR_FILTER_ALARM,
            1
          );

  - platform: template
    id: start_max_timer
    name: "Start Max Timer"
    on_press: 
      - lambda: |-
          id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_START_MAX_TIMER,
            1
          );

  - platform: template
    id: stop_max_timer
    name: "Stop Max Timer"
    on_press: 
      - lambda: |-
          id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_STOP_MAX_TIMER,
            1
          );

number:
  - platform: template
    id: temperature
    name: "Temperature"
    max_value: 30
    min_value: 10
    step: 0.5
    update_interval: 1s
    lambda: |-
      return id(server)->read_holding_register_temperature(
        flexit_modbus_server::REG_TEMPERATURE_SETPOINT
      );
    set_action:
      lambda: |-
        id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_TEMPERATURE_SETPOINT,
            x * 10
        );

  - platform: template
    id: max_timer_minutes
    name: "Max Timer Minutes"
    max_value: 600
    min_value: 1
    step: 1
    disabled_by_default: True
    update_interval: 1s
    lambda: |-
      uint16_t v = id(server)->read_holding_register(flexit_modbus_server::REG_CMD_MINUTES_MAX_TIMER);
      return v;
    set_action:
      lambda: |-
        id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_MINUTES_MAX_TIMER,
            x
        );

  - platform: template
    id: temperature_supply_min
    name: "Temperature Supply Min"
    max_value: 30
    min_value: 10
    step: 0.5
    disabled_by_default: True
    mode: BOX
    update_interval: 1s
    lambda: |-
      uint16_t v = id(server)->read_holding_register(flexit_modbus_server::REG_CMD_TEMPERATURE_SUPPLY_MIN);
      if (v == 0) return {};  // 0 = not synced from the CS60 yet
      return static_cast<int16_t>(v) / 10.0f;
    set_action:
      lambda: |-
        id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_TEMPERATURE_SUPPLY_MIN,
            x * 10
        );

  - platform: template
    id: temperature_supply_max
    name: "Temperature Supply Max"
    max_value: 30
    min_value: 10
    step: 0.5
    disabled_by_default: True
    mode: BOX
    update_interval: 1s
    lambda: |-
      uint16_t v = id(server)->read_holding_register(flexit_modbus_server::REG_CMD_TEMPERATURE_SUPPLY_MAX);
      if (v == 0) return {};  // 0 = not synced from the CS60 yet
      return static_cast<int16_t>(v) / 10.0f;
    set_action:
      lambda: |-
        id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_TEMPERATURE_SUPPLY_MAX,
            x * 10
        );

  - platform: template
    id: filter_change_interval
    name: "Filter Change Interval"
    max_value: 360
    min_value: 30
    step: 30
    mode: BOX
    update_interval: 1s
    lambda: |-
      uint16_t v = id(server)->read_holding_register(flexit_modbus_server::REG_CMD_DAYS_FILTER_CHANGE_INTERVAL);
      return v;
    set_action:
      lambda: |-
        id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_DAYS_FILTER_CHANGE_INTERVAL,
            x
        );

select:
  - platform: template
    id: set_mode
    name: "Set Mode"
    update_interval: 1s
    lambda: |-
      return flexit_modbus_server::mode_to_string(
        id(server)->read_holding_register(flexit_modbus_server::REG_MODE)
      );
    options:
      - Stop
      - Min
      - Normal
      - Max
    set_action:
      lambda: |-
        id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_MODE,
            flexit_modbus_server::string_to_mode(x)
        );

text_sensor:
  # Which packages are asking for a higher mode right now
  - platform: template
    id: mode_boosted_by
    name: "Mode Boosted By"
    icon: "mdi:fan-plus"
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      std::string names;
      for (auto &r : id(mode_requests)) {
        if (!names.empty()) names += ", ";
        names += r.first;
      }
      return names.empty() ? std::string("nothing") : names;

  - platform: template
    id: current_mode
    name: "Current Mode"
    update_interval: 1s
    lambda: |-
      return flexit_modbus_server::mode_to_string(
        id(server)->read_holding_register(
          flexit_modbus_server::REG_MODE
        )
      );
