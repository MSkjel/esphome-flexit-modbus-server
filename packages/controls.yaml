# Mode, setpoint, heater, max timer, filter/alarm reset etc.
# Needs core.yaml

esphome:
  includes:
    - code/controls.h

packages:
  temperature_supply_min: !include
    file: parts/setting_number.yaml
    vars: {id: temperature_supply_min, name: Temperature Supply Min, register: REG_CMD_TEMPERATURE_SUPPLY_MIN,
           min: 5, max: 25, step: 0.5, scale: 10, zero_unknown: "true", category: ""}
  temperature_supply_max: !include
    file: parts/setting_number.yaml
    vars: {id: temperature_supply_max, name: Temperature Supply Max, register: REG_CMD_TEMPERATURE_SUPPLY_MAX,
           min: 15, max: 45, step: 0.5, scale: 10, zero_unknown: "true", category: ""}
  max_timer_minutes: !include
    file: parts/setting_number.yaml
    vars: {id: max_timer_minutes, name: Max Timer Minutes, register: REG_CMD_MINUTES_MAX_TIMER, min: 0, max: 360,
           category: "", mode: AUTO}
  filter_change_interval: !include
    file: parts/setting_number.yaml
    vars: {id: filter_change_interval, name: Filter Change Interval, register: REG_CMD_DAYS_FILTER_CHANGE_INTERVAL,
           min: 30, max: 360, step: 30, zero_unknown: "true", category: "", disabled: "false"}

interval:
  # Runs the highest mode asked for, see code/controls.h. Packages ask with flexit::controls::request().
  - interval: 2s
    then:
      - lambda: flexit::controls::arbiter();

switch:
  - platform: template
    id: heater
    name: "Heater"
    restore_mode: DISABLED
    # from the status, nothing before the first one or while it's old
    lambda: |-
      if (!id(server)->fresh())
        return {};
      return id(server)->read_holding_register(flexit_modbus_server::REG_STATUS_HEATER) != 0;
    # The CX60 ORs the heater flags of the panels present, so on sets our own and off clears all three
    turn_on_action:
      - lambda: id(server)->send_cmd(flexit_modbus_server::REG_CMD_HEATER_PANEL1 + id(server)->server_address() - 1, 1);
    turn_off_action:
      - lambda: |-
          for (int r = flexit_modbus_server::REG_CMD_HEATER_PANEL1; r <= flexit_modbus_server::REG_CMD_HEATER_PANEL3; r++)
            id(server)->send_cmd(r, 0);

  - platform: template
    id: supply_air_control
    name: "Supply Air Control"
    restore_mode: DISABLED
    # The CX60 takes anything but 0 as supply air
    lambda: "return id(server)->read_holding_register(flexit_modbus_server::REG_CMD_TEMPERATURE_SUPPLY_AIR_CONTROL) != 0;"
    turn_on_action:
      - lambda: id(server)->send_cmd(flexit_modbus_server::REG_CMD_TEMPERATURE_SUPPLY_AIR_CONTROL, 1);
    # Extract air regulation needs the extract sensor on, the stock panel sets both
    turn_off_action:
      - lambda: |-
          id(server)->send_cmd(flexit_modbus_server::REG_CMD_TEMPERATURE_SUPPLY_AIR_CONTROL, 0);
          id(server)->send_cmd(flexit_modbus_server::REG_CMD_SENSOR_EXTRACT_ENABLE, 1);

button:
  - platform: template
    id: clear_alarms
    name: "Clear Alarms"
    on_press: 
      - lambda: id(server)->send_cmd(flexit_modbus_server::REG_CMD_CLEAR_ALARMS, 1);

  - platform: template
    id: reset_filter_interval
    name: "Reset Filter Interval"
    on_press: 
      - lambda: id(server)->send_cmd(flexit_modbus_server::REG_CMD_CLEAR_FILTER_ALARM, 1);

  - platform: template
    id: start_max_timer
    name: "Start Max Timer"
    on_press: 
      - lambda: id(server)->send_cmd(flexit_modbus_server::REG_CMD_START_MAX_TIMER, 1);

  - platform: template
    id: stop_max_timer
    name: "Stop Max Timer"
    on_press: 
      - lambda: id(server)->send_cmd(flexit_modbus_server::REG_CMD_STOP_MAX_TIMER, 1);

# From the CX60's status: nothing before the first one, and the setpoint goes unknown while it's old. Template
# entities publish every value their lambda returns, so these return only a new one.
number:
  - platform: template
    id: temperature
    name: "Temperature"
    max_value: 30
    min_value: 10
    step: 0.5
    update_interval: 1s
    lambda: |-
      float t = id(server)->fresh()
                    ? id(server)->read_holding_register_temperature(flexit_modbus_server::REG_TEMPERATURE_SETPOINT)
                    : NAN;
      float now = id(temperature)->state;
      if (id(temperature)->has_state() && (t == now || (std::isnan(t) && std::isnan(now))))
        return {};
      return t;
    set_action:
      lambda: id(server)->send_cmd(flexit_modbus_server::REG_CMD_TEMPERATURE_SETPOINT, static_cast<int16_t>(lroundf(x * 10)));

select:
  - platform: template
    id: set_mode
    name: "Set Mode"
    update_interval: 1s
    lambda: |-
      if (!id(server)->fresh())
        return {};
      auto mode = flexit_modbus_server::mode_to_string(id(server)->read_holding_register(flexit_modbus_server::REG_MODE));
      if (id(set_mode)->current_option() == mode)
        return {};
      return mode;
    options:
      - Stop
      - Min
      - Normal
      - Max
    set_action:
      lambda: id(server)->send_cmd(flexit_modbus_server::REG_CMD_MODE, flexit_modbus_server::string_to_mode(x));

text_sensor:
  # Which packages are asking for a higher mode right now
  - platform: template
    id: mode_boosted_by
    name: "Mode Boosted By"
    icon: "mdi:fan-plus"
    entity_category: diagnostic
    update_interval: 5s
    lambda: return flexit::controls::boosted_by();

  # The same as Set Mode, as a sensor for history and automations
  - platform: template
    id: current_mode
    name: "Current Mode"
    update_interval: 1s
    lambda: |-
      if (!id(server)->fresh())
        return {};
      auto mode = flexit_modbus_server::mode_to_string(id(server)->read_holding_register(flexit_modbus_server::REG_MODE));
      if (id(current_mode)->has_state() && id(current_mode)->state == mode)
        return {};
      return mode;
