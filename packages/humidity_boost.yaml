# Humidity boost. Runs max when the humidity jumps (shower, cooking), then goes back to what it was.
# It starts when the humidity is the trigger delta above its baseline, or has risen the rise trigger within the rise
# minutes, which also catches a shower while the baseline is still up from the last one.
# This is done on the ESP, the CX60 doesn't have it.
# Needs core.yaml, controls.yaml and your own humidity sensor, with its id in flexit_humidity_sensor
substitutions:
  flexit_humidity_sensor: inside_humidity
  # How many minutes of history the baseline looks at, a whole number of at least 2
  flexit_humidity_baseline_window: "60"
  # How many minutes the rise trigger looks back, a whole number of at least 2
  flexit_humidity_rise_minutes: "5"

esphome:
  includes:
    - code/humidity_boost.h

packages:
  # Boost starts when the humidity is this much above the baseline
  humidity_trigger_delta: !include
    file: parts/config_number.yaml
    vars: {id: humidity_trigger_delta, name: Humidity Boost Trigger Delta, unit: "%", icon: "mdi:arrow-up-bold",
           min: 2, max: 30, step: 0.5, initial: 8}
  # and ends when it has been less than this much above it for the release minutes
  humidity_release_delta: !include
    file: parts/config_number.yaml
    vars: {id: humidity_release_delta, name: Humidity Boost Release Delta, unit: "%", icon: "mdi:arrow-down-bold",
           min: 0, max: 20, step: 0.5, initial: 3}
  # or when it has risen this much within the rise minutes, 0 = off
  humidity_rise_trigger: !include
    file: parts/config_number.yaml
    vars: {id: humidity_rise_trigger, name: Humidity Boost Rise Trigger, unit: "%", icon: "mdi:trending-up",
           min: 0, max: 30, step: 0.5, initial: 0}
  humidity_release_minutes: !include
    file: parts/config_number.yaml
    vars: {id: humidity_release_minutes, name: Humidity Boost Release Minutes, unit: min, min: 1, max: 30,
           initial: 5, disabled: "true"}
  humidity_boost_min_minutes: !include
    file: parts/config_number.yaml
    vars: {id: humidity_boost_min_minutes, name: Humidity Boost Min Minutes, unit: min, min: 0, max: 60, initial: 5}
  humidity_boost_max_minutes: !include
    file: parts/config_number.yaml
    vars: {id: humidity_boost_max_minutes, name: Humidity Boost Max Minutes, unit: min, min: 5, max: 240, step: 5,
           initial: 45}
  humidity_boost_cooldown_minutes: !include
    file: parts/config_number.yaml
    vars: {id: humidity_boost_cooldown_minutes, name: Humidity Boost Cooldown Minutes, unit: min, min: 0, max: 120,
           step: 5, initial: 15, disabled: "true"}

switch:
  - platform: template
    name: "Humidity Boost Enable"
    id: humidity_boost_enable
    icon: "mdi:shower"
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON

  # On while boosting. You can also turn it on yourself, it ends the same way as a normal boost.
  - platform: template
    name: "Humidity Boost"
    id: humidity_boost
    icon: "mdi:water-alert"
    optimistic: false
    # Don't pick a boost back up after a reboot, we no longer know which mode to go back to
    restore_mode: ALWAYS_OFF
    lambda: return flexit::humidity_boost::state.boost.active;

    turn_on_action:
      - lambda: flexit::humidity_boost::start();
    turn_off_action:
      - lambda: flexit::humidity_boost::stop();

sensor:
  - platform: template
    id: humidity_baseline
    entity_category: diagnostic
    name: "Humidity Baseline"
    device_class: humidity
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 60s
    # The median of the window is what we call normal humidity
    lambda: return flexit::humidity_boost::baseline_sample(id(${flexit_humidity_sensor}), ${flexit_humidity_baseline_window});
    filters:
      - median:
          window_size: ${flexit_humidity_baseline_window}
          send_every: 1

  # Handy to graph when picking the trigger and release deltas
  - platform: template
    id: humidity_delta
    entity_category: diagnostic
    name: "Humidity Above Baseline"
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 30s
    lambda: return flexit::humidity_boost::above_baseline(id(${flexit_humidity_sensor}));

  # The lowest humidity in the rise minutes, what the rise is measured from
  - platform: template
    id: humidity_rise_low
    internal: true
    update_interval: 60s
    lambda: return flexit::humidity_boost::rise_sample(id(${flexit_humidity_sensor}), ${flexit_humidity_rise_minutes});
    filters:
      - min:
          window_size: ${flexit_humidity_rise_minutes}
          send_every: 1

  # How much it rose over the rise minutes, for picking the rise trigger
  - platform: template
    id: humidity_rise
    entity_category: diagnostic
    name: "Humidity Rise"
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 30s
    lambda: return flexit::humidity_boost::rise(id(${flexit_humidity_sensor}));

interval:
  - interval: 10s
    then:
      - lambda: flexit::humidity_boost::tick(id(${flexit_humidity_sensor}));
