# Humidity boost. Runs max when the humidity jumps (shower, cooking), then goes back to what it was.
# This is done on the ESP, the CS60 doesn't have it.
# Needs core.yaml, controls.yaml and your own humidity sensor, with its id in flexit_humidity_sensor
substitutions:
  flexit_humidity_sensor: inside_humidity
  # How many minutes of history the baseline looks at
  flexit_humidity_baseline_window: "60"

esphome:
  includes:
    - code/humidity_boost.h

globals:
  - id: humidity_boost_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: humidity_boost_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

    # 0 until the first boost has ended, so there is no cooldown before that
  - id: humidity_boost_end_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

    # When the humidity got back under the release level. 0 if it hasn't yet
  - id: humidity_boost_below_release_since_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

    # False from when a boost starts until the humidity is back to normal.
    # Without this a boost that hit the max runtime would just start again after the cooldown.
  - id: humidity_boost_armed
    type: bool
    restore_value: no
    initial_value: 'true'

    # How many samples the baseline has so far
  - id: humidity_baseline_samples
    type: int
    restore_value: no
    initial_value: '0'

switch:
  - platform: template
    name: "Humidity Boost Enable"
    id: humidity_boost_enable
    icon: "mdi:shower"
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON

  # On while boosting. You can also turn it on yourself, it ends the same way as a normal boost.
  - platform: template
    name: "Humidity Boost"
    id: humidity_boost
    icon: "mdi:water-alert"
    optimistic: false
    # Don't pick a boost back up after a reboot, we no longer know which mode to go back to
    restore_mode: ALWAYS_OFF
    lambda: return id(humidity_boost_active);

    turn_on_action:
      - lambda: flexit::humidity_boost::start();
    turn_off_action:
      - lambda: flexit::humidity_boost::stop();

number:
  # Boost starts when the humidity is this much above the baseline
  - platform: template
    name: "Humidity Boost Trigger Delta"
    id: humidity_trigger_delta
    entity_category: config
    unit_of_measurement: "%"
    icon: "mdi:arrow-up-bold"
    min_value: 2
    max_value: 30
    step: 0.5
    initial_value: 8
    optimistic: True
    restore_value: True
    mode: BOX

  # and ends when it has been less than this much above it for the release minutes
  - platform: template
    name: "Humidity Boost Release Delta"
    id: humidity_release_delta
    entity_category: config
    unit_of_measurement: "%"
    icon: "mdi:arrow-down-bold"
    min_value: 0
    max_value: 20
    step: 0.5
    initial_value: 3
    optimistic: True
    restore_value: True
    mode: BOX

  - platform: template
    name: "Humidity Boost Release Minutes"
    id: humidity_release_minutes
    entity_category: config
    unit_of_measurement: "min"
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 5
    optimistic: True
    restore_value: True
    disabled_by_default: True
    mode: BOX

  - platform: template
    name: "Humidity Boost Min Minutes"
    id: humidity_boost_min_minutes
    entity_category: config
    unit_of_measurement: "min"
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 5
    optimistic: True
    restore_value: True
    mode: BOX

  - platform: template
    name: "Humidity Boost Max Minutes"
    id: humidity_boost_max_minutes
    entity_category: config
    unit_of_measurement: "min"
    min_value: 5
    max_value: 240
    step: 5
    initial_value: 45
    optimistic: True
    restore_value: True
    mode: BOX

  - platform: template
    name: "Humidity Boost Cooldown Minutes"
    id: humidity_boost_cooldown_minutes
    entity_category: config
    unit_of_measurement: "min"
    min_value: 0
    max_value: 120
    step: 5
    initial_value: 15
    optimistic: True
    restore_value: True
    disabled_by_default: True
    mode: BOX

sensor:
  - platform: template
    id: humidity_baseline
    entity_category: diagnostic
    name: "Humidity Baseline"
    device_class: humidity
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 60s
    # The median of the window is what we call normal humidity
    lambda: return flexit::humidity_boost::baseline_sample(id(${flexit_humidity_sensor}), ${flexit_humidity_baseline_window});
    filters:
      - median:
          window_size: ${flexit_humidity_baseline_window}
          send_every: 1

  # Handy to graph when picking the trigger and release deltas
  - platform: template
    id: humidity_delta
    entity_category: diagnostic
    name: "Humidity Above Baseline"
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 30s
    lambda: return flexit::humidity_boost::above_baseline(id(${flexit_humidity_sensor}));

interval:
  - interval: 10s
    then:
      - lambda: flexit::humidity_boost::tick(id(${flexit_humidity_sensor}));
