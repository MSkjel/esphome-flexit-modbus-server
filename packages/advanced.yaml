select:
  - platform: template
    name: "Fire Smoke Mode"
    id: fire_smoke_mode
    entity_category: config
    disabled_by_default: True
    # what happens on the fire/smoke input
    options:
      - "Stop"
      - "Supply and Extract Max"
      - "Extract Max"
      - "Supply Max"
    update_interval: 1s
    lambda: |-
      switch (id(server)->read_holding_register(flexit_modbus_server::REG_CMD_FIRE_SMOKE_MODE)) {
        case 1: return std::string("Stop");
        case 2: return std::string("Supply and Extract Max");
        case 3: return std::string("Extract Max");
        case 4: return std::string("Supply Max");
        default: return {};
      }
    set_action:
      lambda: |-
        if (x == "Stop") id(server)->send_cmd(flexit_modbus_server::REG_CMD_FIRE_SMOKE_MODE, 1);
        else if (x == "Supply and Extract Max") id(server)->send_cmd(flexit_modbus_server::REG_CMD_FIRE_SMOKE_MODE, 2);
        else if (x == "Extract Max") id(server)->send_cmd(flexit_modbus_server::REG_CMD_FIRE_SMOKE_MODE, 3);
        else if (x == "Supply Max") id(server)->send_cmd(flexit_modbus_server::REG_CMD_FIRE_SMOKE_MODE, 4);

  - platform: template
    name: "Cooling Min Speed"
    id: cooling_min_speed
    entity_category: config
    disabled_by_default: True
    options:
      - "Normal"
      - "Max"
    update_interval: 1s
    lambda: |-
      switch (id(server)->read_holding_register(flexit_modbus_server::REG_CMD_COOLING_MIN_SPEED)) {
        case 2: return std::string("Normal");
        case 3: return std::string("Max");
        default: return {};
      }
    set_action:
      lambda: |-
        if (x == "Normal") id(server)->send_cmd(flexit_modbus_server::REG_CMD_COOLING_MIN_SPEED, 2);
        else if (x == "Max") id(server)->send_cmd(flexit_modbus_server::REG_CMD_COOLING_MIN_SPEED, 3);

