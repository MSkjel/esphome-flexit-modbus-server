    id: air_volume_comp_extract_speed
    entity_category: config
    disabled_by_default: True
    # AC fans only, used while the hood/fireplace input is on
    options:
      - "Min"
      - "Normal"
      - "Max"
    update_interval: 1s
    lambda: |-
      switch (id(server)->read_holding_register(flexit_modbus_server::REG_CMD_AIR_VOLUME_COMP_EXTRACT_SPEED)) {
        case 1: return std::string("Min");
        case 2: return std::string("Normal");
        case 3: return std::string("Max");
        default: return {};
      }
    set_action:
      lambda: |-
        if (x == "Min") id(server)->send_cmd(flexit_modbus_server::REG_CMD_AIR_VOLUME_COMP_EXTRACT_SPEED, 1);
        else if (x == "Normal") id(server)->send_cmd(flexit_modbus_server::REG_CMD_AIR_VOLUME_COMP_EXTRACT_SPEED, 2);
        else if (x == "Max") id(server)->send_cmd(flexit_modbus_server::REG_CMD_AIR_VOLUME_COMP_EXTRACT_SPEED, 3);

  - platform: template
    name: "Rotor Alarm Type"
    id: rotor_alarm_type
    entity_category: config
    disabled_by_default: True
    options:
      - "A (stop unit)"
      - "B (continue)"
    update_interval: 1s
    lambda: |-
      switch (id(server)->read_holding_register(flexit_modbus_server::REG_CMD_ROTOR_ALARM_TYPE)) {
        case 0: return std::string("A (stop unit)");
        case 1: return std::string("B (continue)");
        default: return {};
      }
    set_action:
      lambda: |-
        if (x == "A (stop unit)") id(server)->send_cmd(flexit_modbus_server::REG_CMD_ROTOR_ALARM_TYPE, 0);
        else if (x == "B (continue)") id(server)->send_cmd(flexit_modbus_server::REG_CMD_ROTOR_ALARM_TYPE, 1);
