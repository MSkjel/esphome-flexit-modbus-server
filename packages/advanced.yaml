    restore_mode: DISABLED
    # needed for extract air (room) regulation
    lambda: "return id(server)->read_holding_register(flexit_modbus_server::REG_CMD_SENSOR_EXTRACT_ENABLE) != 0;"
    turn_on_action:
      - lambda: "id(server)->send_cmd(flexit_modbus_server::REG_CMD_SENSOR_EXTRACT_ENABLE, 1);"
    turn_off_action:
