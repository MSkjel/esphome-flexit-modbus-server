number:
  - platform: template
    name: "Calibration Supply Sensor"
    id: calibration_supply_sensor
    entity_category: config
    disabled_by_default: True
    min_value: -5
    max_value: 5
    step: 0.1
    unit_of_measurement: "°C"
    mode: BOX
    update_interval: 1s
    lambda: |-
      int16_t v = static_cast<int16_t>(id(server)->read_holding_register(flexit_modbus_server::REG_CMD_CALIBRATION_SUPPLY_AIR));
      return v / 10.0f;
    set_action:
      lambda: "id(server)->send_cmd(flexit_modbus_server::REG_CMD_CALIBRATION_SUPPLY_AIR, static_cast<int16_t>(lroundf(x * 10)));"

