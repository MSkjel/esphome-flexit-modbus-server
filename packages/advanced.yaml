# Installer settings from the CI600 menus (Advanced user = PIN 1000, Service = PIN 8888).
# Everything is disabled by default, enable what you need in HA.
# Some of it depends on your unit (EC/AC fans, water coil).
# Needs core.yaml

switch:
  - platform: template
    name: "Supply Air Sensor Enabled"
    id: supply_air_sensor_enabled
    entity_category: config
    disabled_by_default: True
    restore_mode: DISABLED
    lambda: "return id(server)->read_holding_register(flexit_modbus_server::REG_CMD_SENSOR_SUPPLY_ENABLE) != 0;"
    turn_on_action:
      - lambda: "id(server)->send_cmd(flexit_modbus_server::REG_CMD_SENSOR_SUPPLY_ENABLE, 1);"
    turn_off_action:
      - lambda: "id(server)->send_cmd(flexit_modbus_server::REG_CMD_SENSOR_SUPPLY_ENABLE, 0);"

  - platform: template
    name: "Extract Air Sensor Enabled"
