# CO2 control around one target level. You pick how in Home Assistant:
# Stepped runs max when the CO2 is well over the target.
# Proportional turns the normal fan speeds up the further over the target it is.
# PI keeps turning them up until the CO2 is back at the target.
# The last two are for EC fans only.
# This is done on the ESP, the CS60 doesn't have it.
# Needs core.yaml, controls.yaml and your own CO2 sensor, with its id in flexit_co2_sensor
substitutions:
  flexit_co2_sensor: co2

esphome:
  includes:
    - code/co2.h
  on_boot:
    - then:
        - lambda: id(server).add_on_setting_callback(flexit::co2::setting);

select:
  - platform: template
    name: "CO2 Control"
    id: co2_control
    icon: "mdi:molecule-co2"
    optimistic: true
    restore_value: true
    initial_option: "Off"
    options:
      - "Off"
      - "Stepped"
      - "Proportional"
      - "PI"

number:
  # The level to keep the CO2 at. Under this the CO2 control does nothing.
  - platform: template
    name: "CO2 Target"
    id: co2_target
    entity_category: config
    unit_of_measurement: "ppm"
    icon: "mdi:target"
    min_value: 400
    max_value: 1500
    step: 50
    initial_value: 800
    optimistic: True
    restore_value: True
    mode: BOX

  # How far over the target is "high". Stepped goes to max there, proportional has
  # added the full fan increase there, and both fan modes go from min to normal there.
  - platform: template
    name: "CO2 Band"
    id: co2_band
    entity_category: config
    unit_of_measurement: "ppm"
    min_value: 50
    max_value: 1500
    step: 50
    initial_value: 400
    optimistic: True
    restore_value: True
    disabled_by_default: True
    mode: BOX

  # Proportional and PI. The most that is added to the normal fan speeds.
  - platform: template
    name: "CO2 Max Fan Increase"
    id: co2_max_fan_increase
    entity_category: config
    unit_of_measurement: "%"
    icon: "mdi:fan-plus"
    min_value: 5
    max_value: 60
    step: 5
    initial_value: 30
    optimistic: True
    restore_value: True
    mode: BOX

  # PI only. Fan % added for every 100 ppm over the target.
  - platform: template
    name: "CO2 PI Gain"
    id: co2_pi_gain
    entity_category: config
    unit_of_measurement: "%"
    min_value: 1
    max_value: 30
    step: 0.5
    initial_value: 5
    optimistic: True
    restore_value: True
    disabled_by_default: True
    mode: BOX

  # PI only. How long it takes the integral part to add as much as the gain does.
  # Longer is calmer. Too short and the fans go up and down.
  - platform: template
    name: "CO2 PI Integral Time"
    id: co2_pi_integral_time
    entity_category: config
    unit_of_measurement: "min"
    min_value: 5
    max_value: 240
    step: 5
    initial_value: 30
    optimistic: True
    restore_value: True
    disabled_by_default: True
    mode: BOX

sensor:
  # What proportional or PI has added to the normal fan speeds right now. Graph it against the CO2 when tuning.
  - platform: template
    name: "CO2 Fan Increase"
    id: co2_fan_increase
    entity_category: diagnostic
    icon: "mdi:fan-plus"
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      return flexit::co2::fans_up ? std::max(flexit::co2::added, 0) : 0;

binary_sensor:
  - platform: template
    name: "CO2 Control Active"
    id: co2_control_active
    device_class: running
    icon: "mdi:molecule-co2"
    lambda: return flexit::co2::boost_active || flexit::co2::fans_up;

interval:
  - interval: 30s
    then:
      - lambda: flexit::co2::tick(id(${flexit_co2_sensor}));
