# XIAO ESP32-C3 on the XIAO RS485 board, as in example.yaml. No TCP bridge, like most builds.
esphome:
  name: flexit-ci-esp32-c3

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

# ERROR, so every other log compiles out and catches one left as the only statement of an if. The other tests
# build with them all.
logger:
  level: ERROR

substitutions:
  flexit_tx_pin: D4
  flexit_rx_pin: D5
  flexit_tx_enable_pin: D2
  flexit_tx_enable_direct: "false"  # builds the inverted DE pin, esp32.yaml has the direct one

packages:
  common: !include common.yaml
  panel: !include panel.yaml
