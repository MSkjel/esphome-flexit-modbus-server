# Classic ESP32 with a DE pin, the TCP bridge, the panel packages and an online picture
esphome:
  name: flexit-ci-esp32

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

substitutions:
  flexit_tx_pin: GPIO17
  flexit_rx_pin: GPIO16
  flexit_tx_enable_pin: GPIO4
  flexit_address: "1"  # panel.yaml wants the ESP at 1

packages:
  common: !include common.yaml
  panel: !include panel.yaml
  panel_online_picture: !include
    file: ../packages/panel/online_picture.yaml
    vars: {name: radar, url: "http://homeassistant.local:8123/local/radar.png"}

flexit_modbus_server:
  - id: !extend server
    tcp_bridge_enabled: true
