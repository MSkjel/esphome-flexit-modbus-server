# ESP8266 with an inverted DE pin, which the Modbus library drives, and the TCP bridge
esphome:
  name: flexit-ci-esp8266

esp8266:
  board: d1_mini

logger:
  hardware_uart: UART1

substitutions:
  flexit_tx_pin: GPIO1
  flexit_rx_pin: GPIO3

packages:
  common: !include common.yaml

flexit_modbus_server:
  - id: !extend server
    tcp_bridge_enabled: true
    tx_enable_pin:
      number: GPIO5
      inverted: true
