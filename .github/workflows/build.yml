name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The ESP-ModbusRTUServer branch the component is tested and built against: dev with dev, since a change there goes
  # to its dev first, main for everything else, pull requests included
  MODBUS_REF: ${{ github.ref_name == 'dev' && 'dev' || 'main' }}

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install formatters
        run: pip install clang-format==23.1.3 ruff==0.17.1

      - name: C/C++ (clang-format, ESPHome's style)
        run: clang-format --dry-run --Werror $(git ls-files '*.c' '*.h' '*.cpp')

      - name: Python (ruff format)
        run: ruff format --check

      - name: Python (ruff check)
        run: ruff check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: MSkjel/ESP-ModbusRTUServer
          ref: ${{ env.MODBUS_REF }}
          path: modbus-library

      - name: The host tests, see tests/Makefile
        run: make -C tests MODBUS=$GITHUB_WORKSPACE/modbus-library

  # The panel firmware's tests, esp_test too, against the panel code here, at the firmware commit in
  # packages/code/panel/proto.lock
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: The firmware commit
        id: lock
        run: |
          sha=$(awk '$1=="firmware"{print $2}' packages/code/panel/proto.lock)
          if [ -z "$sha" ]; then
            echo "::error::no firmware line in packages/code/panel/proto.lock"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: MSkjel/flexit-ci600-firmware
          ref: ${{ steps.lock.outputs.sha }}
          path: firmware
          fetch-depth: 0  # the tags, for the version

      - run: git -C firmware submodule update --init --depth 1

      - name: Install the 32-bit compilers
        run: |
          apt="sudo apt-get -q -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          $apt update
          $apt install -y --no-install-recommends gcc-multilib g++-multilib

      - run: pip install pyyaml pillow

      - run: make -C firmware/sim check -j"$(nproc)" ESP_REPO="$GITHUB_WORKSPACE"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config: [esp32, esp32-c3, esp8266, esp8266-minimal, esp32-panel-minimal]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ESPHome
        id: esphome
        run: |
          pip install esphome
          echo "version=$(esphome version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6  # PlatformIO for ESP8266, ESPHome's ESP-IDF toolchain for ESP32
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome/idf
          key: build-${{ runner.os }}-${{ matrix.config }}-${{ steps.esphome.outputs.version }}

      - name: Build
        run: |
          set -o pipefail
          esphome -s modbus_library_ref ${{ env.MODBUS_REF }} compile tests/${{ matrix.config }}.yaml 2>&1 | tee build.log

      - name: Check for warnings in our code
        run: tests/check_warnings.sh build.log

      - name: The component built is this checkout's, not the one core.yaml fetches
        run: |
          name=$(sed -n 's/^  name: //p' tests/${{ matrix.config }}.yaml)
          for f in flexit_modbus_server.cpp flexit_modbus_server.h; do
            cmp "tests/.esphome/build/$name/src/esphome/components/flexit_modbus_server/$f" \
                "esphome/components/flexit_modbus_server/$f"
          done
